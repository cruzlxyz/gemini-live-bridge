<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Livetalk face-ghost: liquid blob + blink + a voice-driven mouth -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- liquid blob: 4-stop morph, slow and silky -->
  <path fill="url(#g)" filter="url(#glow)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.25;0.5;0.75;1" keySplines=".45 .05 .55 .95;.45 .05 .55 .95;.45 .05 .55 .95;.45 .05 .55 .95"
      values="M110 42 C150 42 178 62 178 106 C178 150 150 174 108 176 C64 178 40 148 42 106 C44 62 68 42 110 42 Z;
              M112 40 C156 44 176 70 174 110 C172 150 148 172 106 174 C62 176 38 146 40 104 C42 62 70 38 112 40 Z;
              M108 44 C148 38 180 66 176 108 C172 148 146 176 104 174 C60 172 40 144 44 102 C48 60 66 48 108 44 Z;
              M110 42 C152 40 180 64 178 108 C176 152 148 174 108 176 C62 178 42 146 42 104 C42 60 66 42 110 42 Z;
              M110 42 C150 42 178 62 178 106 C178 150 150 174 108 176 C64 178 40 148 42 106 C44 62 68 42 110 42 Z"/>
  </path>

  <!-- eyes: blink on a random-feeling cadence -->
  <g fill="#0c0c16">
    <ellipse cx="96" cy="98" rx="7" ry="9">
      <animate attributeName="ry" dur="4.2s" repeatCount="indefinite"
        keyTimes="0;0.86;0.9;0.94;1" values="9;9;0.8;9;9"/>
    </ellipse>
    <ellipse cx="126" cy="98" rx="7" ry="9">
      <animate attributeName="ry" dur="4.6s" repeatCount="indefinite"
        keyTimes="0;0.83;0.87;0.91;1" values="9;9;0.8;9;9"/>
    </ellipse>
  </g>

  <!-- mouth: a flat bar that rides the voice -->
  <rect x="100" y="126" width="26" height="7" rx="2" fill="#0c0c16" opacity="0.85">
    <animate attributeName="height" dur="0.42s" repeatCount="indefinite"
      values="7;2;11;4;9;7" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"
      keyTimes="0;0.2;0.45;0.65;0.85;1"/>
    <animate attributeName="y" dur="0.42s" repeatCount="indefinite"
      values="126;128.5;123;127.5;124;126"/>
  </rect>
</svg>
